    group_title: "人工修正：PT9L无蓝牙功能前提下的风险文件蓝牙/旧型号残留"
    group_claim: >
      原报告中“PT9L蓝牙功能缺少专项危害分析与验证关闭证据”的结论以
      “PT9L具备蓝牙功能”为前提；人工复核后，该前提不足。设计输入、设计验证计划
      和设计验证报告均将蓝牙相关认证/协议项目标记为不适用。风险文件中出现的
      “PT9L/PT3SBT can transmit ... Bluetooth”更应归类为风险文件范围冲突、
      模板残留或旧型号残留，而不是确认PT9L具有蓝牙功能后的验证缺口。
    group_severity: P1
    group_rationale: >
      设计输入与验证文件是确认产品功能边界的优先证据；这些文件明确显示蓝牙项目
      不适用。风险文件内部又同时出现PT9L蓝牙句子、PT3SBT蓝牙句子以及wireless
      coexistence条目，说明问题核心是风险文件范围/旧型号残留不一致。原有蓝牙专项
      危害或软件验证缺口类finding应从“已确认功能缺少验证”修正为“功能前提不足，
      风险文件存在范围冲突”。
    root_cause: >
      Project Scout将风险管理报告中的一句蓝牙描述直接写入项目画像，未要求设计输入、
      用户说明书、软件需求/方案等权威功能边界文件交叉确认，导致Orchestrator和后续
      Agent沿着错误功能前提生成多条重复蓝牙缺口finding。
    impact: >
      如果不修正，报告会把“PT9L无蓝牙功能”误审成“有蓝牙但缺少验证”，造成整改方向
      错误。正确整改重点应是修订风险文件中的蓝牙/PT3SBT残留，或补充正式说明为何
      这些蓝牙内容适用于PT9L。
    recommended_action: >
      先确认PT9L最终受控功能范围；若PT9L无蓝牙功能，应删除或修订风险文件中的
      蓝牙/PT3SBT残留，并在风险文件修订记录中说明范围澄清。后续代码层面应要求
      Project Scout仅在设计输入、说明书、软件需求/方案等权威来源交叉确认后，才能
      将某项功能写入project_profile。
    merge_decision: manual_correction_false_premise
    manual_correction_note: "用户人工复核确认：PT9L没有蓝牙功能。"
